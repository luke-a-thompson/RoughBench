[model]
family = "quadratic_rough_heston"

[general]
num_paths = 512
seed = 42
log_price = true
plot_variance = false

[parameters]
noise_timesteps = 56
rde_timesteps = 256

v_0 = 0.04
hurst = 0.1
a = 2.0
b = 0.1
c = 0.02
lambda_ = 1.0
eta = 0.3
s_0 = 1.0

[external_variance]
mode = "volterra_simulated"
theta_level = 0.04
truncation_eps = 1e-8
