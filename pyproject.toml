[project]
name = "roughbench"
version = "0.1.2"
description = "A benchmark for rough path methods."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Luke Thompson", email = "luke.thompson@sydney.edu.au" }]
keywords = ["jax", "rough-paths", "machine-learning", "time-series"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "jax[cuda]>=0.8.1",
    "diffrax>=0.7.0",
    "fbm>=0.3.0",
    "pandas>=2.2.3",
    "tqdm>=4.67.1",
]

[project.urls]
"Homepage" = "https://github.com/luke-a-thompson/RoughBench"
"Bug Reports" = "https://github.com/luke-a-thompson/RoughBench/issues"
"Source" = "https://github.com/luke-a-thompson/RoughBench"
"Documentation" = "https://github.com/luke-a-thompson/RoughBench/blob/master/README.md"



[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "matplotlib>=3.10.1",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
